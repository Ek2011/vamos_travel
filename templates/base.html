<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OASIS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .navbar-brand {
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #9775fa, #ff3366);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            font-size: 48px;
        }

        .btn-custom-add {
    background-color: #ff922b;
    color: #ffffff !important;
    border: none;
    text-transform: uppercase;
    letter-spacing: 1px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 800;
    padding: 10px 28px;
    transition: all 0.3s ease-in-out;
    box-shadow: 0 4px 12px rgba(255, 146, 43, 0.25);
}

.btn-custom-add:hover {
    background-color: #f76707;
    color: #ffffff !important;
    box-shadow: 0 6px 18px rgba(255, 146, 43, 0.4);
    transform: translateY(-2px);
}

    </style>
</head>
<body>
<header>
    <nav class="navbar navbar-expand-lg py-1 rounded-0 rounded-bottom-4" style="background-color: #e7f5ff;">
        <div class="container-xxl px-4">
            <a class="navbar-brand" href="/">VAMOS</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                {% if current_user.is_authenticated %}
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item d-flex align-items-center mx-3">
                        <a href="/news" class="btn btn-custom-add">
                            <i class="bi bi-plus-circle"></i> Создать поездку
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto p-1 align-items-center">
    <li class="nav-item d-flex align-items-center">

        <a href="/profile/{{ current_user.id }}"
           class="text-decoration-none fw-semibold me-3"
           /* ДОБАВИЛИ margin-top: 4px; — эта магия плавно опустит буквы neo чуть ниже */
           style="color: #6f42c1; font-size: 40px; line-height: 1; margin-top: 4px;">
            {{ current_user.name }}
        </a>

        <a href="/logout"
           class="btn"
           style="background-color: #ff8787; color: white; padding: 10px 24px; font-size: 1.1rem; font-weight: 600; line-height: 1.2;">
            Выйти
        </a>

    </li>
</ul>

                {% else %}
                <div class="d-flex gap-2 p-1 ms-auto">
                    <a href="/register" class="btn" style="background-color: #9775fa; color: white;">Регистрация</a>
<a href="/login" class="btn" style="background-color: #ffd43b; color: white;">Вход</a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
