<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vamos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<header>
    <div class="container-lg p-4">
        <!-- Шапка -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <h5 class="mb-0">Создание маршрута</h5>
            <a href="/" class="btn-close" aria-label="Закрыть"></a>
        </div>

        <!-- Поле ввода названия -->
        <div class="input-group mb-4">
            <span class="input-group-text" id="inputGroup-sizing-default">Название маршрута</span>
            <input type="text" class="form-control" aria-label="Пример размера поля ввода"
                   aria-describedby="inputGroup-sizing-default">
        </div>

        <!-- Управление точками -->
        <div class="d-flex align-items-center mb-3">
            <p class="mb-0 fs-4 fw-medium">Точки маршрута</p>
            <button type="button" class="btn btn-warning ms-3" data-bs-toggle="modal" data-bs-target="#addPointModal">
                Добавить точку
            </button>
        </div>

        <!-- Список точек маршрута -->
        <div class="d-flex align-items-center mt-3 p-2 bg-light rounded border">
        <span class="badge bg-info text-dark rounded-circle d-inline-flex align-items-center justify-content-center me-3"
              style="width: 30px; height: 30px;">
          1
        </span>
            <p class="mb-0 fs-5 me-auto">Точка, дата</p>

            <!-- Блок с кнопками -->
            <div class="d-flex gap-1">
                <button type="button"
                        class="btn btn-outline-secondary btn-sm p-0 d-flex align-items-center justify-content-center fs-5"
                        style="width: 32px; height: 32px;">▲
                </button>
                <button type="button"
                        class="btn btn-outline-secondary btn-sm p-0 d-flex align-items-center justify-content-center fs-5"
                        style="width: 32px; height: 32px;">▼
                </button>
                <button type="button"
                        class="btn btn-outline-danger btn-sm p-0 d-flex align-items-center justify-content-center"
                        style="width: 32px; height: 32px;" title="Удалить">
                    <i class="bi bi-x-lg fs-5" style="-webkit-text-stroke: 1.5px currentColor;"></i>
                </button>
            </div>
        </div>

        <!-- Кнопки действий -->
        <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
            <button type="button" class="btn btn-secondary">Отмена</button>
            <button type="button" class="btn btn-primary">Сохранить изменения</button>
        </div>

    </div>
</header>
</div>
<div class="modal fade" id="addPointModal" tabindex="-1" aria-labelledby="addPointModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <!-- Окно по умолчанию идет стандартного размера, центрированное -->
        <div class="modal-content shadow-lg"> <!-- shadow-lg добавит красивую тень поверх первого окна -->

            <div class="modal-header bg-warning-subtle"> <!-- легкий оттенок для шапки, чтобы отличалось -->
                <h5 class="modal-title" id="addPointModalLabel">Новая точка маршрута</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <form id="addPointForm" action="/add_point" method="POST">
                <div class="modal-body p-4">
                    <!-- Поле: Название локации -->
                    <div class="mb-3">
                        <label for="pointName" class="form-label">Название точки / Город</label>
                        <input type="text" class="form-control" id="pointName"
                               name="point_name" placeholder="Например: Москва, Красная площадь" required>
                    </div>

                    <!-- Поле: Дата посещения -->
                    <div class="mb-3">
                        <label for="pointDate" class="form-label">Дата посещения</label>
                        <input type="date" class="form-control" id="pointDate" name="point_date" required>
                    </div>
                </div>

                <div class="modal-footer">
                    <!-- При нажатии на отмену вернемся к первому окну -->
                    <button type="button" class="btn btn-secondary" data-bs-target="#routeModal" data-bs-toggle="modal">
                        Отмена
                    </button>
                    <button type="submit" form="addPointForm" class="btn btn-warning">Добавить в маршрут</button>
                </div>

        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>
</body>
</html>
